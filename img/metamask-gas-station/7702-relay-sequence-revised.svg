<title id="title">7702 Relay submission</title>
<desc id="desc">Verified Wallet and Sentinel API calls above a separate conceptual Blockchain panel. Active Shield subscriptions may proxy simulation through the Shield gateway. Server internals and relative timing are not verified. Peer IP may be a proxy or VPN exit. Transaction hash availability does not prove block inclusion.</desc>
